name: Zero CI/CD & Live Deployment

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Job 1: Verification Tests, Typechecks & Production Build
  build-and-test:
    name: Test & Build Web App
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🧪 Run Core Verification Test Suite (20h Math & Anti-Exploit Rules)
        run: npm test

      - name: 🏗️ Build Production Bundle
        run: npm run build

      - name: 📤 Upload GitHub Pages Artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: 💾 Archive Dist Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: zero-web-dist
          path: dist/
          retention-days: 14

  # Job 2: Automated Deployment to GitHub Pages (Live Demo)
  deploy-github-pages:
    name: Deploy to GitHub Pages
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: 🚀 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Job 3: Android Native Architecture Lint & Validation
  android-validation:
    name: Validate Android Subsystem
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: 🔍 Verify Android Source Integrity
        run: |
          echo "Verifying Android source files..."
          test -f android/AndroidManifest.xml || exit 1
          test -f android/app/src/main/java/org/zero/detox/bridge/ZeroNativeBridge.kt || exit 1
          test -f android/app/src/main/java/org/zero/detox/core/LockEngine.kt || exit 1
          test -f android/app/src/main/java/org/zero/detox/receiver/BootReceiver.kt || exit 1
          test -f android/app/src/main/java/org/zero/detox/service/ZeroAccessibilityService.kt || exit 1
          test -f android/app/src/main/java/org/zero/detox/ui/TheVoidActivity.kt || exit 1
          echo "All native Android OS subsystem files validated successfully."
