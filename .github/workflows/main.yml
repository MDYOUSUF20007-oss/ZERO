name: Zero-Distractions — Web, Pages & Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  # ─── JOB 1: Test & Build Web App ──────────────────────────────────────────
  build-web:
    name: Test & Build Web App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Core Productivity Integrity (Anti-Cheat Gate)
        run: node scripts/verify-integrity.mjs

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Verification Tests (20h Rollover & Anti-Exploit)
        run: npm test

      - name: Lint Web & Integrity Modules
        run: npm run lint

      - name: Build Production Bundle
        run: npm run build

      - name: Upload GitHub Pages Artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Archive Web Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: zero-web-dist
          path: dist/
          retention-days: 14

  # ─── JOB 2: Deploy Live Site to GitHub Pages ──────────────────────────────
  deploy-pages:
    name: Deploy to GitHub Pages
    needs: build-web
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: "pages"
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # ─── JOB 3: Build Signed Update-Compatible Android Release APKs ───────────
  build-android-apk:
    name: Build Android APK
    needs: build-web
    runs-on: ubuntu-latest
    env:
      ZERO_VERSION_NAME: 1.0.${{ github.run_number }}
      EXPECTED_CERT_SHA256: A1:4A:36:1E:D4:B7:F7:D6:6E:57:69:92:99:9D:02:8A:05:32:65:85:0A:6C:A4:AF:EE:4F:C1:2F:29:48:CE:11

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Core Productivity Integrity (Anti-Cheat Gate)
        run: node scripts/verify-integrity.mjs

      - name: Compute Monotonic Android Version Code
        run: |
          echo "ZERO_VERSION_CODE=$((100 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Production Assets
        run: npm run build

      - name: Capacitor Sync Android
        run: npx cap sync android

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21
          cache: 'gradle'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

      - name: Grant Executable Permissions to Gradlew
        run: chmod +x android/gradlew

      - name: Decode Persistent Release Signing Keystore
        id: keystore
        env:
          KEYSTORE_B64: ${{ secrets.ZERO_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ZERO_KEYSTORE_PASS }}
          KS_ALIAS: ${{ secrets.ZERO_KEYSTORE_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KS_PASS" ] || [ -z "$KS_ALIAS" ]; then
            echo "::warning::Persistent signing secrets (ZERO_KEYSTORE_BASE64, ZERO_KEYSTORE_PASS, ZERO_KEYSTORE_ALIAS) are not set yet. Building debug-signed preview APKs so you can install and test now; add those 4 Repository secrets for update-compatible permanent releases."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$KEYSTORE_B64" | tr -d '\r\n ' | base64 -d > "${{ runner.temp }}/zero-release.p12"
          keytool -list -v -storetype PKCS12 \
            -keystore "${{ runner.temp }}/zero-release.p12" \
            -storepass "$KS_PASS" \
            -alias "$KS_ALIAS" | grep -E "Alias name:|SHA256:"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Run Android Unit Tests (Standard & Strict)
        run: |
          cd android
          set -o pipefail
          if ! ./gradlew testStandardReleaseUnitTest testStrictReleaseUnitTest --no-daemon --stacktrace 2>&1 | tee gradle-test.log; then
            echo "### Android Unit Test / Compile Failure Log" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tail -n 80 gradle-test.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            grep -E "error:|e: |FAILED|AssertionError|Exception|What went wrong" gradle-test.log | head -n 20 | while IFS= read -r line; do
              echo "::error::${line}"
            done || true
            exit 1
          fi

      - name: Compile Signed Release APKs (v${{ env.ZERO_VERSION_NAME }} / code ${{ env.ZERO_VERSION_CODE }})
        if: steps.keystore.outputs.signed == 'true'
        env:
          ZERO_KEYSTORE_PATH: ${{ runner.temp }}/zero-release.p12
          ZERO_KEYSTORE_TYPE: PKCS12
          ZERO_KEYSTORE_PASS: ${{ secrets.ZERO_KEYSTORE_PASS }}
          ZERO_KEYSTORE_KEY_PASS: ${{ secrets.ZERO_KEYSTORE_KEY_PASS }}
          ZERO_KEYSTORE_ALIAS: ${{ secrets.ZERO_KEYSTORE_ALIAS }}
        run: |
          cd android
          ./gradlew assembleStandardRelease assembleStrictRelease --no-daemon --stacktrace

      - name: Compile Preview Test APKs (Debug-Signed Fallback)
        if: steps.keystore.outputs.signed != 'true'
        run: |
          cd android
          ./gradlew assembleStandardDebug assembleStrictDebug --no-daemon --stacktrace
          mkdir -p ../release-assets
          cp app/build/outputs/apk/strict/debug/app-strict-debug.apk "../release-assets/ZERO-requires-adb-v${ZERO_VERSION_NAME}-preview.apk"
          cp app/build/outputs/apk/standard/debug/app-standard-debug.apk "../release-assets/ZERO-v${ZERO_VERSION_NAME}-preview.apk"
          (cd ../release-assets && sha256sum *.apk > SHA256SUMS.txt)
          cat ../release-assets/SHA256SUMS.txt

      - name: Verify APK Signing Certificate & Stage Release Assets
        if: steps.keystore.outputs.signed == 'true'
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name "apksigner" | sort -V | tail -n 1)
          mkdir -p release-assets
          cp android/app/build/outputs/apk/strict/release/app-strict-release.apk "release-assets/ZERO-requires-adb-v${ZERO_VERSION_NAME}.apk"
          cp android/app/build/outputs/apk/standard/release/app-standard-release.apk "release-assets/ZERO-v${ZERO_VERSION_NAME}.apk"

          EXPECTED_CLEAN=$(echo "$EXPECTED_CERT_SHA256" | tr -d ':' | tr '[:upper:]' '[:lower:]')
          for apk in release-assets/*.apk; do
            echo "Verifying $apk..."
            "$APKSIGNER" verify --print-certs "$apk"
            CERT_HEX=$("$APKSIGNER" verify --print-certs "$apk" | grep "SHA-256 digest" | head -n1 | awk '{print $NF}' | tr '[:upper:]' '[:lower:]')
            if [ "$CERT_HEX" != "$EXPECTED_CLEAN" ]; then
              echo "::error::Certificate mismatch for $apk! Expected $EXPECTED_CLEAN got $CERT_HEX"
              exit 1
            fi
          done

          (cd release-assets && sha256sum *.apk > SHA256SUMS.txt)
          cat release-assets/SHA256SUMS.txt

      - name: Upload Strict Accessibility APK Artifact (Full Zero Mode)
        uses: actions/upload-artifact@v4
        with:
          name: ZERO-requires-adb-apk
          path: release-assets/ZERO-requires-adb-v${{ env.ZERO_VERSION_NAME }}*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Standard Sideload APK Artifact (Usage Access + Overlay)
        uses: actions/upload-artifact@v4
        with:
          name: ZERO-apk
          path: release-assets/ZERO-v${{ env.ZERO_VERSION_NAME }}*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish Direct Download GitHub Release (Signed)
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && steps.keystore.outputs.signed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.ZERO_VERSION_NAME }}
          name: Zero-Distractions v${{ env.ZERO_VERSION_NAME }} (code ${{ env.ZERO_VERSION_CODE }})
          make_latest: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-assets/*.apk
            release-assets/SHA256SUMS.txt
          body: |
            ### Zero-Distractions (Zero App) v${{ env.ZERO_VERSION_NAME }} (`versionCode ${{ env.ZERO_VERSION_CODE }}`)

            **Seamless In-Place Updates (V1 + V2 + V3 Signed):** Every official release (`v1.0.19+`) shares Zero App's permanent certificate (`SHA-256: ${{ env.EXPECTED_CERT_SHA256 }}`), now with explicit **V1 + V2 + V3 APK signing** for broad Android OEM file-manager compatibility.
            *(Troubleshooting if an older `v1.0.18-preview` or earlier debug build fails to update with "App not installed": open **Settings & OS → OS → Installed Build & Update Key** to confirm whether your phone is on the old debug key `0D6F...`. If so, export or cloud-sync a `.zbak` backup first, uninstall the old preview **for all users**, and install this release once — all future updates on the `A14A...CE11` key update cleanly in-place. Also always update within the same edition with higher `versionCode`, and allow **Install unknown apps** for Chrome / Files.)*

            #### Which APK should I install?
            - **`ZERO-v${{ env.ZERO_VERSION_NAME }}.apk` (Standard Edition — Direct Install):** Clean browser / file-manager install without `BIND_ACCESSIBILITY_SERVICE`. Enforces your Bags via **Usage Access + Display Over Other Apps** watchdog.
            - **`ZERO-requires-adb-v${{ env.ZERO_VERSION_NAME }}.apk` (Strict Accessibility Edition — Full Zero Mode):** Uses Android Accessibility Service to block Notification shade, Quick Settings, Settings, Recents, and unbagged apps. *(On Android 14–16 devices, install via `adb install -r` or Shizuku / "Install with Options", or tap **Open Zero App Info → ⋮ Allow restricted settings**.)*

            #### What's New
            - **Release Hardening (R8/ProGuard + Runtime APK Signature Guard + Root/Emulator Protection):** Enabled full R8 code & resource shrinking (`minifyEnabled true`, `shrinkResources true`) with tailored keep rules for Capacitor & `ZeroAccessibilityService`, added runtime APK SHA-256 signature verification in `MainActivity` + `AppSecurityGuard` to abort modified/re-signed APKs immediately, and added root / custom ROM / debug emulator checks that gracefully disable backup restore & preset Bag tampering.
            - **Donor Perks & Badges + Ko-fi Manual Verification Support UI:** Added a dedicated **Donor Perks & Badges** section in **Settings** and **Support** showing live `ZERO-SUPPORTER` crest/ticket status, offline signed unlock token (`ZDON1...` / `ZBAK1...`) activation, native Android `mailto:` launching, and pure AMOLED `#000000` + purple `#8B5CF6` manual Ko-fi verification contact details (`mdyousuf982007@proton.me`).
            - **APK Update Signing Fix (V1 + V2 + V3 + FOSS Clean Metadata) & Build Inspector:** Explicit multi-scheme V1+V2+V3 release signing in `build.gradle`, removed Play DependencyInfo block, and added **Installed Build & Update Key** diagnostics inside **Settings → OS** so you can verify your installed certificate and version code anytime.
            - **Redesigned Permission Priority & Green Restricted Settings Fix Guide:** Both **Permissions Setup** and **Rules → OS** now enforce priority order **1. Allow Restricted Settings Check (App Info Shortcut) → 2. Usage Access (Find Zero) / Accessibility → 3. Display Over Other Apps → 4. Notifications**, with bright **green step-by-step Restricted Settings instructions** right below `Grant Usage Access → Find Zero` + a direct **Open Zero App Info (Shortcut)** button.
            - **Serverless Universal Cloud Auto-Backup (`zero-backup.zbak`):** Native Android SAF (`CloudAutoBackupPlugin`) automatically syncs signed, SHA-256 HMAC-verified backups to **Google Drive, Microsoft OneDrive, JioDrive, Dropbox, or Local Storage**, plus **Weekly 1-Tap Reminder Banner** and **1-Tap Cloud Restore** (skips onboarding straight to Dashboard).
            - **Full Theme Studio (`AMOLED`, `Paper like Kindle`, `Matte Studio`), Emergency Escape Tickets (`🎫`) & Focus Badges:** Pure & Gradient AMOLED, custom Paper/Ink Kindle & Matte pickers, and all 6 milestone badges + Golden **`ZERO-SUPPORTER`** crest.

      - name: Publish Direct Download GitHub Release (Debug-Signed Preview)
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && steps.keystore.outputs.signed != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.ZERO_VERSION_NAME }}
          name: Zero-Distractions v${{ env.ZERO_VERSION_NAME }} (code ${{ env.ZERO_VERSION_CODE }})
          make_latest: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-assets/*.apk
            release-assets/SHA256SUMS.txt
          body: |
            ### Zero-Distractions (Zero App) v${{ env.ZERO_VERSION_NAME }} (`versionCode ${{ env.ZERO_VERSION_CODE }}`)

            > **Build Signing Note:** These preview APKs use CI debug signing because persistent release signing secrets (`ZERO_KEYSTORE_BASE64`, `ZERO_KEYSTORE_PASS`, `ZERO_KEYSTORE_ALIAS`) are not configured yet in Repository Secrets. Open **Rules → Export Backup** before replacing a differently signed build.

            #### Which APK should I install?
            - **`ZERO-v${{ env.ZERO_VERSION_NAME }}-preview.apk` (Standard Edition — Direct Install):** Clean sideloading without `BIND_ACCESSIBILITY_SERVICE`, enforcing Bags via **Usage Access + Display Over Other Apps**.
            - **`ZERO-requires-adb-v${{ env.ZERO_VERSION_NAME }}-preview.apk` (Strict Accessibility Edition — Full Zero Mode):** Full Accessibility Service lock blocking Notification shade, Settings, Recents, and unbagged apps (use `adb install -r`, Shizuku, or Allow Restricted Settings on Android 14–16).

            #### What's New
            - **Release Hardening (R8/ProGuard + Runtime APK Signature Guard + Root/Emulator Protection):** Enabled full R8 code & resource shrinking (`minifyEnabled true`, `shrinkResources true`) with tailored keep rules for Capacitor & `ZeroAccessibilityService`, added runtime APK SHA-256 signature verification in `MainActivity` + `AppSecurityGuard` to abort modified/re-signed APKs immediately, and added root / custom ROM / debug emulator checks that gracefully disable backup restore & preset Bag tampering.
            - **Donor Perks & Badges + Ko-fi Manual Verification Support UI:** Added **Donor Perks & Badges** inside **Settings** & **Support** with signed unlock token verification (`ZDON1...` / `ZBAK1...`) and pure AMOLED `#000000` + purple `#8B5CF6` Ko-fi receipt support contact (`mdyousuf982007@proton.me`).
            - **Redesigned Permission Priority & Green Restricted Settings Fix Guide:** Priority setup order **1. Allow Restricted Settings Check (App Info Shortcut) → 2. Usage Access (Find Zero) / Accessibility → 3. Display Over Other Apps → 4. Notifications** with green Android 13–16 Restricted Settings steps.
            - **Serverless Universal Cloud Auto-Backup (`zero-backup.zbak`):** Native Android SAF (`CloudAutoBackupPlugin`) automatically syncs HMAC-signed backups to **Google Drive, Microsoft OneDrive, JioDrive, Dropbox, or Local Storage** with zero API keys or servers, plus **Weekly 1-Tap Reminder Banner** and **1-Tap Cloud Restore** (skips onboarding straight to Dashboard).
            - **Full Theme Studio (`AMOLED`, `Paper like Kindle`, `Matte Studio`):** Pure & Gradient AMOLED finishes, Paper like Kindle presets + custom paper/ink pickers, and Matte Studio + custom surface/accent pickers.
            - **Emergency Escape Tickets (`🎫`) & Strict Min ₹50 `ZERO-SUPPORTER` Rule:** Renamed *Parachutes* to **Emergency Escape Tickets**; Golden **`ZERO-SUPPORTER`** Badge strictly requires your **1st tip of minimum ₹50**.
            - **Flex Receipt Badges Showcase:** All 6 milestone badges + Golden **`ZERO-SUPPORTER`** crest render right on the shareable Focus Receipt PNG card.
