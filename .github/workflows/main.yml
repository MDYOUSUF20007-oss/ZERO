name: Zero — Web, Pages & Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # ─── JOB 1: Test & Build Web App ──────────────────────────────────────────
  build-web:
    name: Test & Build Web App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Verification Tests (20h Rollover & Anti-Exploit)
        run: npm test

      - name: Build Production Bundle
        run: npm run build

      - name: Upload GitHub Pages Artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Archive Web Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: zero-web-dist
          path: dist/
          retention-days: 14

  # ─── JOB 2: Deploy Live Site to GitHub Pages ──────────────────────────────
  deploy-pages:
    name: Deploy to GitHub Pages
    needs: build-web
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: "pages"
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # ─── JOB 3: Build Installable Android Release APKs ────────────────────────
  build-android-apk:
    name: Build Android APK
    needs: build-web
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Production Assets
        run: npm run build

      - name: Capacitor Sync Android
        run: npx cap sync android

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21
          cache: 'gradle'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

      - name: Grant Executable Permissions to Gradlew
        run: chmod +x android/gradlew

      - name: Generate Release Signing Keystore
        run: |
          keytool -genkeypair -v \
            -keystore "${{ runner.temp }}/zero-release.jks" \
            -alias zero_release \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass zero_foss_2026 \
            -keypass zero_foss_2026 \
            -dname "CN=Zero Digital Detox FOSS, OU=OpenSource, O=Zero, L=Global, C=US"

      - name: Compile Standard & Strict Release APKs
        env:
          ZERO_KEYSTORE_PATH: ${{ runner.temp }}/zero-release.jks
          ZERO_KEYSTORE_PASS: zero_foss_2026
          ZERO_KEYSTORE_ALIAS: zero_release
        run: |
          cd android
          ./gradlew testStandardReleaseUnitTest assembleStandardRelease assembleStrictRelease --no-daemon --stacktrace
          ls -lh app/build/outputs/apk/*/*/*.apk

      - name: Upload Standard APK (Direct Install / Sideload-Safe)
        uses: actions/upload-artifact@v4
        with:
          name: Zero-v1.0.0-standard-apk
          path: android/app/build/outputs/apk/standard/release/app-standard-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Strict Accessibility APK (ADB Edition)
        uses: actions/upload-artifact@v4
        with:
          name: Zero-v1.0.0-strict-adb-apk
          path: android/app/build/outputs/apk/strict/release/app-strict-release.apk
          if-no-files-found: error
          retention-days: 30
