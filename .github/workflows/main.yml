name: Zero — Web, Pages & Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # ─── JOB 1: Test & Build Web App ──────────────────────────────────────────
  build-web:
    name: Test & Build Web App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Verification Tests (20h Rollover & Anti-Exploit)
        run: npm test

      - name: Build Production Bundle
        run: npm run build

      - name: Upload GitHub Pages Artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Archive Web Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: zero-web-dist
          path: dist/
          retention-days: 14

  # ─── JOB 2: Deploy Live Site to GitHub Pages ──────────────────────────────
  deploy-pages:
    name: Deploy to GitHub Pages
    needs: build-web
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: "pages"
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # ─── JOB 3: Build Installable Android APK ─────────────────────────────────
  build-android-apk:
    name: Build Android APK
    needs: build-web
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies & Build Web Assets
        run: |
          npm ci
          npm run build
          npx cap sync android

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant Executable Permissions to Gradlew
        run: chmod +x android/gradlew

      - name: Compile Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Installable Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Zero-v1.0.0-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
