name: Zero — Web, Pages & Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  # ─── JOB 1: Test & Build Web App ──────────────────────────────────────────
  build-web:
    name: Test & Build Web App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Verification Tests (20h Rollover & Anti-Exploit)
        run: npm test

      - name: Build Production Bundle
        run: npm run build

      - name: Upload GitHub Pages Artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Archive Web Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: zero-web-dist
          path: dist/
          retention-days: 14

  # ─── JOB 2: Deploy Live Site to GitHub Pages ──────────────────────────────
  deploy-pages:
    name: Deploy to GitHub Pages
    needs: build-web
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: "pages"
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # ─── JOB 3: Build Signed Update-Compatible Android Release APKs ───────────
  build-android-apk:
    name: Build Android APK
    needs: build-web
    runs-on: ubuntu-latest
    env:
      ZERO_VERSION_CODE: ${{ 100 + github.run_number }}
      ZERO_VERSION_NAME: 1.0.${{ github.run_number }}
      EXPECTED_CERT_SHA256: A1:4A:36:1E:D4:B7:F7:D6:6E:57:69:92:99:9D:02:8A:05:32:65:85:0A:6C:A4:AF:EE:4F:C1:2F:29:48:CE:11

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Production Assets
        run: npm run build

      - name: Capacitor Sync Android
        run: npx cap sync android

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21
          cache: 'gradle'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

      - name: Grant Executable Permissions to Gradlew
        run: chmod +x android/gradlew

      - name: Decode Persistent Release Signing Keystore
        env:
          KEYSTORE_B64: ${{ secrets.ZERO_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ZERO_KEYSTORE_PASS }}
          KS_ALIAS: ${{ secrets.ZERO_KEYSTORE_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KS_PASS" ] || [ -z "$KS_ALIAS" ]; then
            if [ "${{ github.ref }}" = "refs/heads/main" ]; then
              echo "::error::Missing persistent signing secrets (ZERO_KEYSTORE_BASE64, ZERO_KEYSTORE_PASS, ZERO_KEYSTORE_ALIAS). Refusing to generate disposable keys so user updates never require uninstalling."
              exit 1
            else
              echo "PR build without secrets: skipping release signing."
              exit 0
            fi
          fi
          echo "$KEYSTORE_B64" | tr -d '\r\n ' | base64 -d > "${{ runner.temp }}/zero-release.p12"
          keytool -list -v -storetype PKCS12 \
            -keystore "${{ runner.temp }}/zero-release.p12" \
            -storepass "$KS_PASS" \
            -alias "$KS_ALIAS" | grep -E "Alias name:|SHA256:"

      - name: Compile Standard & Strict Release APKs (v${{ env.ZERO_VERSION_NAME }} / code ${{ env.ZERO_VERSION_CODE }})
        env:
          ZERO_KEYSTORE_PATH: ${{ runner.temp }}/zero-release.p12
          ZERO_KEYSTORE_TYPE: PKCS12
          ZERO_KEYSTORE_PASS: ${{ secrets.ZERO_KEYSTORE_PASS }}
          ZERO_KEYSTORE_KEY_PASS: ${{ secrets.ZERO_KEYSTORE_KEY_PASS }}
          ZERO_KEYSTORE_ALIAS: ${{ secrets.ZERO_KEYSTORE_ALIAS }}
        run: |
          cd android
          ./gradlew testStandardReleaseUnitTest testStrictReleaseUnitTest assembleStandardRelease assembleStrictRelease --no-daemon --stacktrace

      - name: Verify APK Signing Certificate & Stage Release Assets
        if: secrets.ZERO_KEYSTORE_BASE64 != ''
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name "apksigner" | sort -V | tail -n 1)
          mkdir -p release-assets
          cp android/app/build/outputs/apk/strict/release/app-strict-release.apk "release-assets/Zero-v${ZERO_VERSION_NAME}-strict-accessibility.apk"
          cp android/app/build/outputs/apk/standard/release/app-standard-release.apk "release-assets/Zero-v${ZERO_VERSION_NAME}-standard-sideload.apk"

          EXPECTED_CLEAN=$(echo "$EXPECTED_CERT_SHA256" | tr -d ':' | tr '[:upper:]' '[:lower:]')
          for apk in release-assets/*.apk; do
            echo "Verifying $apk..."
            "$APKSIGNER" verify --print-certs "$apk"
            CERT_HEX=$("$APKSIGNER" verify --print-certs "$apk" | grep "SHA-256 digest" | head -n1 | awk '{print $NF}' | tr '[:upper:]' '[:lower:]')
            if [ "$CERT_HEX" != "$EXPECTED_CLEAN" ]; then
              echo "::error::Certificate mismatch for $apk! Expected $EXPECTED_CLEAN got $CERT_HEX"
              exit 1
            fi
          done

          (cd release-assets && sha256sum *.apk > SHA256SUMS.txt)
          cat release-assets/SHA256SUMS.txt

      - name: Upload Strict Accessibility APK Artifact (Full BlockIt Mode)
        if: secrets.ZERO_KEYSTORE_BASE64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: Zero-strict-accessibility-apk
          path: release-assets/Zero-v${{ env.ZERO_VERSION_NAME }}-strict-accessibility.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Standard Sideload APK Artifact (Usage Access + Overlay)
        if: secrets.ZERO_KEYSTORE_BASE64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: Zero-standard-sideload-apk
          path: release-assets/Zero-v${{ env.ZERO_VERSION_NAME }}-standard-sideload.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish Direct Download GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.ZERO_KEYSTORE_BASE64 != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.ZERO_VERSION_NAME }}
          name: Zero v${{ env.ZERO_VERSION_NAME }} (code ${{ env.ZERO_VERSION_CODE }})
          make_latest: true
          generate_release_notes: true
          files: |
            release-assets/*.apk
            release-assets/SHA256SUMS.txt
          body: |
            ### Zero Digital Detox v${{ env.ZERO_VERSION_NAME }} (`versionCode ${{ env.ZERO_VERSION_CODE }}`)

            **Seamless In-Place Updates:** Signed with Zero's permanent release certificate (`SHA-256: ${{ env.EXPECTED_CERT_SHA256 }}`). Future updates install directly over previous releases without losing Parachutes, Bags, or history.

            #### Which APK should I install?
            - **`Zero-v${{ env.ZERO_VERSION_NAME }}-strict-accessibility.apk` (Recommended — Full BlockIt Mode):** Uses Android Accessibility Service to lock the notification drawer, Settings, Recents, and all apps outside your active Bag. *(On Android 14–16 devices with Play Protect sideload restrictions, install via `adb install -r` or Shizuku / "Install with Options", then allow Restricted Settings if prompted.)*
            - **`Zero-v${{ env.ZERO_VERSION_NAME }}-standard-sideload.apk` (Direct Browser/File Manager Install):** Omits `BIND_ACCESSIBILITY_SERVICE` for clean sideloading and enforces focus via **Usage Access + Display Over Other Apps** watchdog.
