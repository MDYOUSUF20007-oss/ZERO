name: Zero-Distractions — Integrity & PR Verification Build

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-build:
    name: Integrity Gate, Tests & Android Unit Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Core Productivity Integrity (Anti-Cheat Gate)
        run: node scripts/verify-integrity.mjs

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Verification Tests (Integrity, 20h Rollover, ZBAK & Tokens)
        run: npm test

      - name: Lint TypeScript & React Code
        run: npm run lint

      - name: Build Production Web Bundle
        run: npm run build

      - name: Capacitor Sync Android
        run: npx cap sync android

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21
          cache: 'gradle'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

      - name: Grant Executable Permissions to Gradlew
        run: chmod +x android/gradlew

      - name: Run Android Unit Tests (Standard & Strict)
        run: |
          cd android
          ./gradlew testStandardReleaseUnitTest testStrictReleaseUnitTest --no-daemon --stacktrace
