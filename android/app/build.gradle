// Zero-Noise (Zero App) — Android Build & Release Hardening Configuration
// Display name resolves from res/values/strings.xml ("Zero-Noise");
// applicationId stays "org.zero.detox" to preserve seamless in-place APK updates.
apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

def isCI = System.getenv("CI") != null || System.getenv("GITHUB_ACTIONS") != null
def targetJavaVersion = isCI ? JavaVersion.VERSION_21 : JavaVersion.VERSION_17
def targetJvmTarget = isCI ? '21' : '17'

android {
    namespace = "org.zero.detox"
    compileSdk = rootProject.ext.compileSdkVersion
    def envVersionCode = System.getenv("ZERO_VERSION_CODE")
    def resolvedVersionCode = (envVersionCode != null && envVersionCode.isInteger()) ? envVersionCode.toInteger() : 300
    def envVersionName = System.getenv("ZERO_VERSION_NAME")
    def resolvedVersionName = (envVersionName != null && !envVersionName.trim().isEmpty()) ? envVersionName.trim() : "1.0.300"

    defaultConfig {
        applicationId "org.zero.detox"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode resolvedVersionCode
        versionName resolvedVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    flavorDimensions "edition"
    productFlavors {
        strict {
            dimension "edition"
            versionNameSuffix "-strict"
        }
        standard {
            dimension "edition"
        }
    }
    signingConfigs {
        release {
            def ksPath = System.getenv("ZERO_KEYSTORE_PATH")
            if (ksPath != null && !ksPath.trim().isEmpty() && file(ksPath).exists()) {
                def ksType = System.getenv("ZERO_KEYSTORE_TYPE")
                if (ksType != null && !ksType.trim().isEmpty()) {
                    storeType ksType
                } else if (ksPath.toLowerCase().endsWith(".p12") || ksPath.toLowerCase().endsWith(".pfx")) {
                    storeType "PKCS12"
                }
                storeFile file(ksPath)
                storePassword System.getenv("ZERO_KEYSTORE_PASS")
                keyAlias System.getenv("ZERO_KEYSTORE_ALIAS")
                def keyPass = System.getenv("ZERO_KEYSTORE_KEY_PASS")
                keyPassword (keyPass != null && !keyPass.trim().isEmpty() ? keyPass : System.getenv("ZERO_KEYSTORE_PASS"))
                // Explicitly sign with V1 + V2 + V3 using ZERO's permanent release cert
                // so Android 7–16 package installers & OEM file managers always accept in-place updates.
                enableV1Signing = true
                enableV2Signing = true
                enableV3Signing = true
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            def ksPath = System.getenv("ZERO_KEYSTORE_PATH")
            if (ksPath != null && !ksPath.trim().isEmpty() && file(ksPath).exists()) {
                signingConfig signingConfigs.release
            }
        }
    }
    dependenciesInfo {
        // Keep FOSS APK clean from encrypted Google Play dependency metadata blocks.
        includeInApk = false
        includeInBundle = false
    }
    packaging {
        resources {
            excludes += [
                'META-INF/LICENSE*',
                'META-INF/NOTICE*',
                'META-INF/DEPENDENCIES',
                'META-INF/INDEX.LIST',
                'META-INF/AL2.0',
                'META-INF/LGPL2.1'
            ]
        }
    }
    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility targetJavaVersion
        targetCompatibility targetJavaVersion
    }
    kotlinOptions {
        jvmTarget = targetJvmTarget
    }
    lint {
        checkReleaseBuilds false
        abortOnError false
    }
    testOptions {
        unitTests.returnDefaultValues = true
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs_nio:2.0.4'
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.core:core-ktx:$androidxCoreVersion"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1"
    implementation "androidx.work:work-runtime-ktx:2.9.1"
    implementation 'com.github.TeamNewPipe:NewPipeExtractor:v0.27.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    testImplementation 'org.json:json:20250517'
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

if (!isCI) {
    android {
        compileOptions {
            sourceCompatibility targetJavaVersion
            targetCompatibility targetJavaVersion
        }
        kotlinOptions {
            jvmTarget = targetJvmTarget
        }
    }
}

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
