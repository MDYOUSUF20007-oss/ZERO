apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    namespace = "org.zero.detox"
    compileSdk = rootProject.ext.compileSdkVersion
    def envVersionCode = System.getenv("ZERO_VERSION_CODE")
    def resolvedVersionCode = (envVersionCode != null && envVersionCode.isInteger()) ? envVersionCode.toInteger() : 100
    def envVersionName = System.getenv("ZERO_VERSION_NAME")
    def resolvedVersionName = (envVersionName != null && !envVersionName.trim().isEmpty()) ? envVersionName.trim() : "1.0.0"

    defaultConfig {
        applicationId "org.zero.detox"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode resolvedVersionCode
        versionName resolvedVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    flavorDimensions "edition"
    productFlavors {
        strict {
            dimension "edition"
            versionNameSuffix "-strict"
        }
        standard {
            dimension "edition"
        }
    }
    signingConfigs {
        release {
            def ksPath = System.getenv("ZERO_KEYSTORE_PATH")
            if (ksPath != null && !ksPath.trim().isEmpty() && file(ksPath).exists()) {
                def ksType = System.getenv("ZERO_KEYSTORE_TYPE")
                if (ksType != null && !ksType.trim().isEmpty()) {
                    storeType ksType
                } else if (ksPath.toLowerCase().endsWith(".p12") || ksPath.toLowerCase().endsWith(".pfx")) {
                    storeType "PKCS12"
                }
                storeFile file(ksPath)
                storePassword System.getenv("ZERO_KEYSTORE_PASS")
                keyAlias System.getenv("ZERO_KEYSTORE_ALIAS")
                def keyPass = System.getenv("ZERO_KEYSTORE_KEY_PASS")
                keyPassword (keyPass != null && !keyPass.trim().isEmpty() ? keyPass : System.getenv("ZERO_KEYSTORE_PASS"))
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            def ksPath = System.getenv("ZERO_KEYSTORE_PATH")
            if (ksPath != null && !ksPath.trim().isEmpty() && file(ksPath).exists()) {
                signingConfig signingConfigs.release
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    kotlinOptions {
        jvmTarget = '21'
    }
    lint {
        checkReleaseBuilds false
        abortOnError false
    }
    testOptions {
        unitTests.returnDefaultValues = true
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.core:core-ktx:$androidxCoreVersion"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1"
    implementation "androidx.work:work-runtime-ktx:2.9.1"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    testImplementation 'org.json:json:20250517'
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
